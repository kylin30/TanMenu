name: CI

on:
  push:
    # Release tags run the stricter build/test/package pipeline in github-release.yml.
    # Keeping this workflow branch-only avoids doing the same Release build twice.
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    # Windows is required: the app targets net10.0-windows and several tests touch real Windows
    # APIs (Win32 icon extraction, shell .lnk resolution via source-generated COM, the registry).
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TanMenu.slnx

      - name: Build
        run: dotnet build TanMenu.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/TanMenu.Core.Tests/TanMenu.Core.Tests.csproj -c Release --no-build

  overlay-win32-probe:
    # Separate from build-test and from the main-only NativeAOT smoke. This job discovers whether
    # the hosted Windows VM has an input desktop and, only then, drives the real preview window
    # with SendInput against another process. windows-latest is Windows Server 2025, not Windows 11.
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build overlay probe
        run: dotnet build src/TanMenu.IslandProbe/TanMenu.IslandProbe.csproj -c Release

      - name: Run overlay probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path probe-out | Out-Null
          $probe = Start-Process -FilePath "src/TanMenu.IslandProbe/bin/Release/net10.0-windows10.0.19041.0/win-x64/TanMenu.IslandProbe.exe" -ArgumentList "--out","probe-out" -Wait -PassThru -NoNewWindow
          exit $probe.ExitCode

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overlay-win32-probe
          path: probe-out
          if-no-files-found: warn

  publish-smoke:
    # `dotnet build` never runs ILC, so the build-test job above cannot prove the app is
    # PUBLISHABLE. Under NativeAOT the interesting failures (ILC errors, an unresolvable native
    # link, trim/AOT warnings promoted to errors) only appear at publish time. Without this job the
    # first proof would be the release tag itself, which is unrecoverable: a published tag must
    # never be moved to different source (docs/portable-release.md).
    # Restricted to main pushes because an AOT publish is far slower than the ordinary build.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Ensure vswhere is on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Command vswhere.exe -ErrorAction SilentlyContinue) {
            Write-Host 'vswhere.exe is already on PATH.'
            exit 0
          }
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          if (!(Test-Path (Join-Path $installer 'vswhere.exe'))) {
            throw "vswhere.exe was not found under '$installer'. ILC uses it to locate the MSVC linker and Windows SDK libs for the native link step."
          }
          Add-Content -Path $env:GITHUB_PATH -Value $installer
          Write-Host "Added '$installer' to PATH."

      - name: Publish (NativeAOT)
        run: dotnet publish src/TanMenu.Wpf/TanMenu.Wpf.csproj -c Release -p:Platform=x64 /p:PublishProfile=win-x64

      - name: Verify the publish output is native
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'src/TanMenu.Wpf/bin/publish/win-x64'
          if (!(Test-Path (Join-Path $dir 'TanMenu.Wpf.exe'))) {
            throw "Publish output is missing TanMenu.Wpf.exe."
          }
          foreach ($managed in @('TanMenu.Wpf.dll', 'coreclr.dll', 'TanMenu.Wpf.runtimeconfig.json')) {
            if (Test-Path (Join-Path $dir $managed)) {
              throw "Publish output contains '$managed', so PublishAot did not apply."
            }
          }
          $files = @(Get-ChildItem $dir -Recurse -File)
          $megabytes = [math]::Round((($files | Measure-Object Length -Sum).Sum / 1MB), 1)
          Write-Host "Publish payload: $($files.Count) files, $megabytes MB."
